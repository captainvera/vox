[project]
name = "vox"
version = "0.1.0"
description = "Menubar STT for macOS — record, transcribe, clipboard"
requires-python = ">=3.12"
dependencies = [
    "rumps>=0.4.0",
    "voxmlx>=0.0.2",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "parakeet-mlx>=0.3.0",
    "moonshine-voice>=0.0.40",
]

[project.scripts]
vox = "vox.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox"]
